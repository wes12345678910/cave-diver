services:
  # Game Server - Backend
  - type: web
    name: cave-diver-server
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node --import tsx server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # Frontend Client - Static Site
  - type: web         # Use 'web' for the top-level type
    name: cave-diver-client
    env: static       # This tells Render it's a Static Site
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist  # Note the change to 'staticPublishPath'
    envVars:
      - key: VITE_SERVER_URL
        value: https://cave-diver-server.onrender.com
