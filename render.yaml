services:
  # Game Server - Backend
  - type: web
    name: cave-diver-server
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node --import tsx server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # Frontend Client - Static Site
  - type: static
    name: cave-diver-client
    region: oregon
    buildCommand: npm install && npm run build
    buildPublishDir: dist
    # NOTE: After first server deploy, update this URL to your server URL
    # Server will be at: https://cave-diver-server-xxx.onrender.com
    envVars:
      - key: VITE_SERVER_URL
        value: https://cave-diver-server.onrender.com
