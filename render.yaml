services:
  # Game Server - Backend
  - type: web
    name: cave-diver-server
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node --import tsx server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # Frontend Client - Static Site
  - type: static_site  # <--- Changed from 'static' to 'static_site'
    name: cave-diver-client
    region: oregon
    buildCommand: npm install && npm run build
    publishDir: dist    # <--- Changed from 'buildPublishDir' to 'publishDir'
    envVars:
      - key: VITE_SERVER_URL
        value: https://cave-diver-server.onrender.com
